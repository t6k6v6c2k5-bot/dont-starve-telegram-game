<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Don't Starve: Multiplayer</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0d11;
    color: #e0d7c6;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    -webkit-user-select: none;
  }
  #game-container { position: relative; width: 100vw; height: 100vh; overscroll-behavior: none; touch-action: none; }
  canvas { display: block; background: #1a1612; width: 100%; height: 100%; touch-action: none; }

  /* ---------- Top UI ---------- */
  #ui-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .bars { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
  .bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #d4af37; }
  .bar-bg {
    width: 120px; height: 10px; background: rgba(0,0,0,0.5);
    border: 1px solid #4a3f30; border-radius: 3px; overflow: hidden;
  }
  .bar-fill { height: 100%; transition: width 0.2s; }
  #health-fill { background: #8b2c2c; }
  #hunger-fill { background: #7c8b2c; }

  #resources {
    background: rgba(0,0,0,0.45); border: 1px solid #4a3f30; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: #d4af37; text-align: right;
    pointer-events: auto;
    cursor: pointer;
  }

  #players-list {
    position: absolute; top: 70px; right: 10px;
    background: rgba(0,0,0,0.4); border: 1px solid #4a3f30; border-radius: 6px;
    padding: 6px 10px; font-size: 11px; color: #8c8275; max-width: 160px;
    pointer-events: none;
  }
  #players-list .title { color: #d4af37; margin-bottom: 4px; }

  #clock-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.45); border: 1px solid #4a3f30; border-radius: 20px;
    padding: 4px 14px; font-size: 12px; color: #d4af37;
    pointer-events: none; display: flex; align-items: center; gap: 6px;
  }

  #action-hint {
    position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); border: 1px solid #d4af37; border-radius: 6px;
    padding: 10px 18px; font-size: 13px; color: #d4af37;
    display: none;
    pointer-events: auto;
  }
  #action-hint.visible { display: block; }
  #action-hint:active { background: rgba(212,175,55,0.25); }

  /* ---------- Campfire contextual panel ---------- */
  #fire-panel {
    position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    display: none;
    gap: 8px;
  }
  #fire-panel.visible { display: flex; }
  #fire-panel button {
    font-family: inherit; font-size: 12px; color: #e0d7c6;
    background: rgba(0,0,0,0.65); border: 1px solid #d4af37; border-radius: 6px;
    padding: 8px 12px;
  }
  #fire-panel button:active { background: rgba(212,175,55,0.25); }
  #fire-panel button:disabled { opacity: 0.4; }

  /* ---------- Virtual Joystick ---------- */
  #joystick-zone {
    position: absolute; left: 24px; bottom: 24px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(212,175,55,0.35);
    touch-action: none;
  }
  #joystick-stick {
    position: absolute; left: 50%; top: 50%;
    width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%;
    background: rgba(212,175,55,0.55);
    border: 2px solid #d4af37;
    pointer-events: none;
  }

  #eat-btn {
    position: absolute; right: 24px; bottom: 24px;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(124,139,44,0.35); border: 2px solid #7c8b2c;
    color: #e0d7c6; font-size: 11px;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  #eat-btn:active { background: rgba(124,139,44,0.6); }

  #sound-btn {
    position: absolute; right: 24px; bottom: 110px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: 1px solid #4a3f30;
    color: #d4af37; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  #sound-btn:active { background: rgba(212,175,55,0.25); }

  .desktop-hint {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #6b6255; pointer-events: none;
  }

  /* ---------- Inventory panel ---------- */
  #inventory-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 20;
  }
  #inventory-overlay.visible { display: flex; }
  #inventory-panel {
    width: min(320px, 88vw);
    background: #17130f; border: 2px solid #4a3f30; border-radius: 10px;
    padding: 16px; color: #e0d7c6;
  }
  #inventory-panel h2 {
    font-size: 14px; color: #d4af37; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #inventory-panel .close-x { cursor: pointer; color: #8c8275; font-size: 16px; }
  .inv-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #2b241c; font-size: 13px;
  }
  .inv-row:last-child { border-bottom: none; }
  .inv-label { display: flex; align-items: center; gap: 8px; }
  .inv-count { color: #d4af37; }
  #craft-section { margin-top: 14px; }
  #craft-section .hint { font-size: 11px; color: #8c8275; margin-bottom: 8px; }
  #craft-campfire-btn {
    width: 100%; font-family: inherit; font-size: 13px; color: #e0d7c6;
    background: rgba(212,175,55,0.15); border: 1px solid #d4af37; border-radius: 6px;
    padding: 10px;
  }
  #craft-campfire-btn:active { background: rgba(212,175,55,0.3); }
  #craft-campfire-btn:disabled { opacity: 0.4; }

  @media (min-width: 768px) {
    #joystick-zone, #eat-btn { opacity: 0.35; }
  }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-top">
      <div class="bars">
        <div class="bar-row">HP <div class="bar-bg"><div id="health-fill" class="bar-fill" style="width:100%"></div></div></div>
        <div class="bar-row">Голод <div class="bar-bg"><div id="hunger-fill" class="bar-fill" style="width:100%"></div></div></div>
      </div>
      <div id="resources">
        🪵 <span id="wood-count">0</span> &nbsp; 🪨 <span id="stone-count">0</span> &nbsp; 🍖 <span id="meat-count">0</span>
        <div style="font-size:9px; color:#8c8275; margin-top:2px;">тап — инвентарь</div>
      </div>
    </div>

    <div id="clock-badge"><span id="clock-icon">☀️</span><span id="clock-text">День</span></div>

    <div id="players-list">
      <div class="title">Онлайн</div>
      <div id="players-list-body"></div>
    </div>

    <div id="action-hint">Рубить</div>

    <div id="fire-panel">
      <button id="sit-btn">Сесть</button>
      <button id="feed-btn">Подкинуть дров</button>
    </div>

    <div id="joystick-zone">
      <div id="joystick-stick"></div>
    </div>

    <div id="eat-btn">Есть</div>
    <div id="sound-btn">🔊</div>

    <div class="desktop-hint">WASD — движение | E — взаимодействие | I — инвентарь</div>

    <div id="inventory-overlay">
      <div id="inventory-panel">
        <h2>Инвентарь <span class="close-x" id="inventory-close">✕</span></h2>
        <div class="inv-row">
          <div class="inv-label">🪵 Дерево</div>
          <div class="inv-count" id="inv-wood">0</div>
        </div>
        <div class="inv-row">
          <div class="inv-label">🪨 Камень</div>
          <div class="inv-count" id="inv-stone">0</div>
        </div>
        <div class="inv-row">
          <div class="inv-label">🍖 Мясо</div>
          <div class="inv-count" id="inv-meat">0</div>
        </div>
        <div id="craft-section">
          <div class="hint">Постройки</div>
          <button id="craft-campfire-btn">🔥 Костёр (3 дерева)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
